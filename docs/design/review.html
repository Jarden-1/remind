<body>
<main class="review">
  <div class="intro"><h1>Remind · 视觉方案</h1><span class="draft-label">2026-10-16 · 已选同宽操作</span></div>
  <p class="intro-text">保留大数字与原刻度，只比较控件层级和间距。状态、数值与按钮均为设计演示，不连接应用或系统权限。</p>
  <div class="review-controls">
    <div class="variants" role="group" aria-label="操作样式"><button data-variant="light" aria-pressed="false">轻量操作</button><button data-variant="equal" aria-pressed="true">同宽操作</button></div>
    <label>查看状态<select id="scene"><option value="ready">待开始</option><option value="running">计时中</option><option value="paused">手动暂停</option><option value="meeting">会议中</option><option value="permission">缺少权限</option><option value="update">更新可用</option><option value="notice">提前提醒</option><option value="break">休息界面</option><option value="settings">提醒设置</option></select></label>

    <label><input id="measure" type="checkbox">查看尺寸</label>
  </div>
  <div id="preview" class="preview"><div id="product" class="product"></div><div id="notice" class="notice" hidden><span>1 分钟后休息</span><button class="icon" aria-label="关闭提前提醒">×</button></div><div id="menu" class="duration-menu" hidden></div></div>
  <p id="feedback" class="demo-feedback" role="status"></p>
  <p id="variant-note" class="review-note"><strong>同宽操作（已选）：</strong>两项同宽同高，开始／暂停填色，重置使用轻描边。保留原刻度，时间选项无灰底。</p>
  <div id="measurements" class="measurements" hidden><span>宽度 368</span><span>左右边距 24</span><span>时长行 32</span><span>操作按钮 40</span><span>时长行 → 操作 24</span><span>操作 → 底边 24</span></div>

</main>
<script>
const product=document.getElementById('product'), preview=document.getElementById('preview'), scene=document.getElementById('scene'), menu=document.getElementById('menu'), notice=document.getElementById('notice'), feedback=document.getElementById('feedback');
let variant='equal',current='ready',returnScene='ready',available=false,work=45,rest=3,draft=null,noticeTimer=null,menuKind=null,menuTrigger=null;
const settingsIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9M14 17H5"/><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/></svg>';
const closeIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';
function header(){return '<header class="product-header"><div class="brand"><span class="mark" aria-hidden="true"></span>remind</div><div class="chrome"><button class="icon" data-action="settings" aria-label="打开设置">'+settingsIcon+'</button><button class="icon" data-action="chrome" aria-label="最小化演示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="icon" data-action="chrome" aria-label="退出演示">'+closeIcon+'</button></div></header>'}
function closeMenu(restore=false){menu.hidden=true;menuKind=null;if(restore)menuTrigger?.focus()}
function ticks(active){return '<div class="rail" aria-label="本轮进度"><div class="ticks">'+Array.from({length:36},(_,i)=>'<span class="'+(i<active?'past':'')+'"></span>').join('')+'</div><div class="rest-ticks"><span></span><span></span><span></span></div></div>'}
function mainView(){
 const labels={ready:'未开始',running:'计时中',paused:'已暂停',meeting:'会议中',permission:'计时中',update:'计时中',notice:'即将休息'};
 const time=current==='ready'?String(work).padStart(2,'0')+':00':current==='notice'?'01:00':'32:18';
 const [minutes,seconds]=time.split(':');
 let context='';
 if(current==='meeting')context='<div class="context"><span>腾讯会议，提醒已暂停</span><button class="text-action" data-action="ignore">本次忽略</button></div>';
 if(current==='permission')context='<div class="context"><span>需要辅助功能权限</span><button class="text-action" data-action="permission">去开启</button></div>';
 const primary=current==='ready'?'开始提醒':current==='paused'?'继续提醒':current==='meeting'?'手动暂停':'暂停提醒';
 product.innerHTML=header()+'<div class="product-body"><div class="heading"><span>距离下次休息</span><span class="state '+(['running','permission','update','notice'].includes(current)?'active':'')+'">'+labels[current]+'</span></div><div class="countdown'+(minutes.length>2?' long':'')+'" aria-label="剩余 '+time+'"><span>'+minutes+'</span><span class="colon">:</span><span>'+seconds+'</span></div>'+ticks(current==='ready'?0:current==='notice'?35:10)+'<div class="rhythm"><button data-duration="work" aria-haspopup="menu" aria-expanded="false"><span class="label">间隔</span><span class="value">'+work+' 分钟</span><span class="arrow" aria-hidden="true"></span></button><button data-duration="rest" aria-haspopup="menu" aria-expanded="false"><span class="label">休息</span><span class="value">'+rest+' 分钟</span><span class="arrow" aria-hidden="true"></span></button></div>'+context+'<div class="actions"><button class="action primary" data-action="primary">'+primary+'</button><button class="action secondary" data-action="reset">重置时间</button></div></div>'+(current==='update'?'<div class="update"><span>有新版本可用</span><button class="text-action" data-action="settings">查看更新</button></div>':'');
}
function checkRow(name,label,checked,help=''){return '<label class="setting-row check-row"><span>'+label+(help?'<span class="small-help" style="display:block">'+help+'</span>':'')+'</span><input type="checkbox" role="switch" name="'+name+'" '+(checked?'checked':'')+'></label>'}
function dayPicker(){return '<div class="segments custom-days" style="margin-top:12px" '+(draft.days!=='custom'?'hidden':'')+'>'+[[1,'一'],[2,'二'],[3,'三'],[4,'四'],[5,'五'],[6,'六'],[0,'日']].map(([value,label])=>'<button data-day="'+value+'" aria-label="星期'+label+'" aria-pressed="'+draft.customDays.includes(value)+'">'+label+'</button>').join('')+'</div>'}
function settingsView(){
 if(!draft)draft={work,rest,schedule:false,pre:true,sound:false,meeting:false,days:'weekdays',customDays:[1,2,3,4,5],start:'09:00',end:'18:00'};
 product.innerHTML='<header class="settings-header"><button class="icon" data-action="cancel-settings" aria-label="返回看板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button><h2>提醒设置</h2><span style="width:28px"></span></header><div class="settings-content"><section class="group"><h2>时间</h2><label class="setting-row">提醒间隔<span class="unit-input"><input name="work" aria-label="提醒间隔分钟" type="number" min="1" max="240" value="'+draft.work+'">分钟</span></label><label class="setting-row">休息时长<span class="unit-input"><input name="rest" aria-label="休息时长分钟" type="number" min="1" max="30" value="'+draft.rest+'">分钟</span></label></section><section class="group"><h2>提醒</h2>'+checkRow('pre','提前 1 分钟提醒',draft.pre,'显示 5 秒后自动关闭')+checkRow('sound','休息铃声',draft.sound)+'</section><section class="group"><h2>工作时段</h2>'+checkRow('schedule','限定工作时段',draft.schedule,'时段外不提醒')+'<div class="schedule" '+(!draft.schedule?'hidden':'')+'><div class="segments" role="group" aria-label="工作日期">'+[['weekdays','工作日'],['everyday','每天'],['custom','自定义']].map(([value,label])=>'<button data-days="'+value+'" aria-pressed="'+(draft.days===value)+'">'+label+'</button>').join('')+'</div>'+dayPicker()+'<div class="time-range"><input type="time" name="start" aria-label="工作开始时间" value="'+draft.start+'"><span>至</span><input type="time" name="end" aria-label="工作结束时间" value="'+draft.end+'"></div><p class="small-help" id="days-help">'+(draft.days==='weekdays'?'周一至周五':draft.days==='everyday'?'每天':'选择每周提醒的日期')+'</p></div></section><section class="group"><h2>会议</h2>'+checkRow('meeting','会议自动暂停',draft.meeting,'实验性 · 腾讯会议、飞书')+'</section><section class="group"><h2>系统与更新</h2><div class="setting-row"><span>软件更新</span><button class="text-action" data-action="demo-update">'+(available?'下载更新':'检查更新')+'</button></div></section><p id="settings-error" class="settings-error" role="alert" hidden></p></div><footer class="settings-footer"><button class="action secondary" data-action="cancel-settings">取消</button><button class="action primary" data-action="save-settings">保存设置</button></footer>';
}
function render(){
 clearTimeout(noticeTimer);closeMenu();notice.hidden=true;feedback.textContent='';product.className='product'+(variant==='equal'?' equal':'');
 if(current==='break'){
   product.className='break-preview';product.innerHTML='<div class="break-time">03:00</div><div class="break-actions"><button data-action="snooze">延后 5 分钟</button><button data-action="skip">跳过</button></div>';
 }else if(current==='settings')settingsView();else mainView();
 if(current==='notice'){notice.hidden=false;noticeTimer=setTimeout(()=>{notice.hidden=true;feedback.textContent='提前提醒已自动关闭，原定休息时间保持不变。'},5000)}
 scene.value=current;
}
function changeScene(value){if(value==='settings'&&current!=='settings')returnScene=current;if(value==='update')available=true;draft=null;current=value;render()}
function openMenu(kind,trigger){
 if(!menu.hidden&&menuKind===kind){closeMenu(true);return}
 menuKind=kind;menuTrigger=trigger;const value=kind==='work'?work:rest;const options=kind==='work'?[30,45,60]:[1,3,5];
 menu.innerHTML=options.map(minutes=>'<button role="menuitemradio" aria-checked="'+(minutes===value)+'" data-minutes="'+minutes+'">'+minutes+' 分钟<span>'+(minutes===value?'✓':'')+'</span></button>').join('')+'<form class="custom-time"><input inputmode="numeric" aria-label="自定义分钟" value="'+value+'"><button type="submit">确定</button></form><p class="menu-error" role="alert" hidden></p>';
 menu.hidden=false;menu.setAttribute('role','menu');const area=preview.getBoundingClientRect(),rect=trigger.getBoundingClientRect(),box=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(rect.left-area.left,area.width-170))+'px';const below=rect.bottom-area.top+6;menu.style.top=Math.max(8,below+box.height>area.height-8?rect.top-area.top-box.height-6:below)+'px';trigger.setAttribute('aria-expanded','true');(menu.querySelector('[aria-checked=true]')??menu.querySelector('input'))?.focus();
}
function applyMinutes(value){const max=menuKind==='work'?240:30;if(!Number.isInteger(value)||value<1||value>max){const error=menu.querySelector('.menu-error');error.hidden=false;error.textContent='请输入 1–'+max+' 的整数';return}const kind=menuKind;if(kind==='work')work=value;else rest=value;render();product.querySelector('[data-duration='+kind+']')?.focus()}
document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>{variant=button.dataset.variant;document.querySelectorAll('[data-variant]').forEach(item=>item.setAttribute('aria-pressed',item===button));document.getElementById('variant-note').innerHTML=variant==='light'?'<strong>轻量操作：</strong>开始／暂停为主按钮，重置为次要文字操作。时间选项无灰底，不与操作按钮争夺注意力。':'<strong>同宽操作：</strong>两项同宽同高，开始／暂停填色，重置使用轻描边。对齐更明确，控件感比文字方案更强。';render()}));
scene.addEventListener('change',()=>changeScene(scene.value));document.getElementById('theme').addEventListener('change',event=>document.documentElement.dataset.theme=event.target.value);document.getElementById('measure').addEventListener('change',event=>document.getElementById('measurements').hidden=!event.target.checked);
product.addEventListener('change',event=>{if(!draft)return;const input=event.target;if(input.matches('input')){draft[input.name]=input.type==='checkbox'?input.checked:input.type==='number'?input.valueAsNumber:input.value;if(input.name==='schedule')product.querySelector('.schedule').hidden=!draft.schedule}});
product.addEventListener('click',event=>{
 const target=event.target.closest('button');if(!target)return;
 if(target.dataset.duration){openMenu(target.dataset.duration,target);return}
 if(target.dataset.day!==undefined){const day=Number(target.dataset.day);draft.customDays=draft.customDays.includes(day)?draft.customDays.filter(item=>item!==day):[...draft.customDays,day];target.setAttribute('aria-pressed',draft.customDays.includes(day));return}
 if(target.dataset.days){draft.days=target.dataset.days;product.querySelector('.custom-days').hidden=draft.days!=='custom';product.querySelectorAll('[data-days]').forEach(button=>button.setAttribute('aria-pressed',button===target));product.querySelector('#days-help').textContent=draft.days==='weekdays'?'周一至周五':draft.days==='everyday'?'每天':'选择每周提醒的日期';return}
 const action=target.dataset.action;
 if(action==='settings'){returnScene=current;draft=null;current='settings';render()}
 if(action==='cancel-settings'){changeScene(returnScene)}
 if(action==='save-settings'){
   let error='';if(!Number.isInteger(draft.work)||draft.work<1||draft.work>240)error='提醒间隔请输入 1–240 的整数';else if(!Number.isInteger(draft.rest)||draft.rest<1||draft.rest>30)error='休息时长请输入 1–30 的整数';else if(draft.schedule&&draft.days==='custom'&&!draft.customDays.length)error='请至少选择一个工作日';else if(draft.schedule&&(!draft.start||!draft.end||draft.end<=draft.start))error='结束时间需晚于开始时间';
   if(error){const message=product.querySelector('#settings-error');message.hidden=false;message.textContent=error;message.scrollIntoView({block:'nearest'});return}
   work=draft.work;rest=draft.rest;changeScene(returnScene);feedback.textContent='设计预览中的数值已保存，未修改软件设置。';
 }
 if(action==='primary')changeScene(current==='ready'||current==='paused'?'running':'paused');
 if(action==='reset'){changeScene('running');product.querySelector('.countdown').innerHTML='<span>'+String(work).padStart(2,'0')+'</span><span class="colon">:</span><span>00</span>';feedback.textContent='演示重置为完整间隔。'}
 if(action==='ignore')changeScene('running');
 if(action==='permission')feedback.textContent='正式软件会打开系统辅助功能设置，返回后按实际权限重新检测。';
 if(action==='demo-update')feedback.textContent='这是设计预览，未检查版本、下载或安装软件。';
 if(action==='chrome')feedback.textContent='这是窗口控件示意，不会关闭或最小化已安装软件。';
 if(action==='skip'||action==='snooze')changeScene('running');
});
menu.addEventListener('click',event=>{const button=event.target.closest('[data-minutes]');if(button)applyMinutes(Number(button.dataset.minutes))});menu.addEventListener('submit',event=>{event.preventDefault();applyMinutes(Number(menu.querySelector('input').value))});
menu.addEventListener('keydown',event=>{if(event.target.matches('input'))return;const options=[...menu.querySelectorAll('[data-minutes]')];let index=options.indexOf(document.activeElement);if(event.key==='ArrowDown')index=(index+1)%options.length;else if(event.key==='ArrowUp')index=(index+options.length-1)%options.length;else if(event.key==='Home')index=0;else if(event.key==='End')index=options.length-1;else return;event.preventDefault();options[index]?.focus()});
notice.querySelector('button').addEventListener('click',()=>{clearTimeout(noticeTimer);notice.hidden=true});document.addEventListener('pointerdown',event=>{if(!menu.hidden&&!menu.contains(event.target)&&!event.target.closest('[data-duration]'))closeMenu()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!menu.hidden){event.preventDefault();closeMenu(true)}else if(current==='settings')changeScene(returnScene);else if(current==='break')changeScene('running')}});
render();
</script>
</body>
