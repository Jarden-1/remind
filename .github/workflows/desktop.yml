name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            certificate: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
          - os: windows-2025
            platform: win
            certificate: WIN_CSC_LINK
            password: WIN_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets[matrix.certificate] }}
      CSC_KEY_PASSWORD: ${{ secrets[matrix.password] }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Require a matching version for tagged releases
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/check-release.mjs
      - name: Build installers
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          # Missing GitHub secrets are exported as empty strings. electron-builder
          # treats an empty CSC_LINK as a certificate path and fails with
          # "<workspace> not a file". Unset blanks so unsigned builds succeed,
          # while a real certificate still signs.
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          args=(--publish never)
          if [ -n "${CSC_LINK:-}" ]; then
            # A real Developer ID certificate replaces ad-hoc signing.
            args+=(-c.forceCodeSigning=true)
          elif [ "$RELEASE_PLATFORM" = "mac" ]; then
            # identity null strips every signature. macOS then reports a
            # quarantined app as damaged. "-" is an ad-hoc signature, valid
            # for arm64 and x64, so Gatekeeper shows the unidentified
            # developer prompt instead. spctl still rejects ad-hoc apps;
            # that assessment is logged below and must not fail the build.
            args+=("-c.mac.identity=-" -c.mac.gatekeeperAssess=false)
          fi
          npx electron-builder --"$RELEASE_PLATFORM" "${args[@]}"
      - name: Verify macOS code signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          # macOS runners ship Bash 3.2, which has no mapfile.
          apps=()
          while IFS= read -r app; do
            [ -n "$app" ] && apps+=("$app")
          done < <(find release -name 'remind.app' -type d | sort)
          echo "App bundles:"
          printf '  %s\n' "${apps[@]}"
          if [ "${#apps[@]}" -lt 2 ]; then
            echo "Expected separate arm64 and x64 app bundles."
            find release -maxdepth 3 -type d
            exit 1
          fi
          verify_app() {
            local app="$1"
            echo "== codesign display: $app =="
            codesign -dv --verbose=4 "$app"
            echo "== codesign verify: $app =="
            codesign --verify --deep --strict --verbose=2 "$app"
            echo "== spctl: $app =="
            spctl --assess --type execute --verbose=4 "$app" || echo "spctl did not accept this signature. Ad-hoc signatures are recorded here and should produce an unidentified-developer prompt rather than a damaged-app error."
          }
          for app in "${apps[@]}"; do verify_app "$app"; done
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "== disk image: $dmg =="
            attach=$(hdiutil attach "$dmg" -nobrowse -readonly)
            echo "$attach"
            mount=$(printf '%s\n' "$attach" | awk -F'\t' '/\/Volumes\// { print $NF; exit }')
            if [ -z "$mount" ]; then echo "Could not mount $dmg"; exit 1; fi
            app=$(find "$mount" -maxdepth 3 -name 'remind.app' -type d -print -quit)
            if [ -z "$app" ]; then hdiutil detach "$mount" || true; echo "No app in $dmg"; exit 1; fi
            verify_app "$app"
            hdiutil detach "$mount"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: remind-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          retention-days: 14

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: remind-*
          merge-multiple: true
          path: dist
      - name: Publish a draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer files were produced."
            exit 1
          fi
          printf 'Publishing %s files\n' "${#files[@]}"
          notes='Draft macOS (DMG and ZIP) and Windows (NSIS) installers.

          Without Developer ID secrets, the Mac app is ad-hoc signed. Gatekeeper should show the normal unidentified-developer prompt. If macOS still says the app is damaged, right-click remind.app and choose Open, or run: xattr -cr /Applications/remind.app

          A Developer ID certificate and notarization replace that ad-hoc signature when the signing secrets are set.

          This release stays a draft until it is published manually. The in-app updater only offers published releases.'
          # This job has no checkout. gh treats a missing git repo as a hard error
          # unless --repo is set, even when GH_TOKEN is present.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "remind $GITHUB_REF_NAME" --notes "$notes"
          fi
