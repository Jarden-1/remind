appId: com.jarden.remind
productName: remind
directories:
  output: release
  buildResources: desktop/assets
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: desktop/native/bin
    to: native
    filter: [meeting-probe.node, libmeeting-probe.dylib, meeting-probe.exe]
publish:
  provider: github
  owner: Jarden-1
  repo: remind
  releaseType: draft
mac:
  icon: desktop/assets/icon.icns
  category: public.app-category.healthcare-fitness
  minimumSystemVersion: '14.0'
  hardenedRuntime: true
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
artifactName: remind-${version}-${os}-${arch}.${ext}
